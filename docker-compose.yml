services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: openfga
      POSTGRES_DB: openfga
    ports:
      - "5433:5432"
    volumes:
      - openfga-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga"]
      interval: 3s
      timeout: 5s
      retries: 10

  openfga-migrate:
    image: ghcr.io/openfga/openfga:latest
    depends_on:
      postgres:
        condition: service_healthy
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: "postgres://openfga:openfga@postgres:5432/openfga?sslmode=disable"

  openfga:
    image: ghcr.io/openfga/openfga:latest
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: "postgres://openfga:openfga@postgres:5432/openfga?sslmode=disable"
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: "vls-demo-local-key"
    ports:
      - "8081:8080" # HTTP API
      - "8082:8081" # gRPC (unused here)
      - "3001:3000" # metrics/playground port (disabled, harmless)

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - openfga
    environment:
      OPENFGA_API_URL: "http://openfga:8080"
      OPENFGA_API_KEY: "vls-demo-local-key"
      PORT: "4000"
    ports:
      - "4000:4000"

volumes:
  openfga-pg:
