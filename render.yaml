# Render Blueprint — one-click deploy of the whole stack on the free tier.
# Provisions: free Postgres + OpenFGA server (official Docker image) + the app.
# See README.md for the phone walkthrough.

envVarGroups:
  - name: openfga-shared-key
    envVars:
      # OpenFGA's preshared API key. Both services include this group, so the
      # server uses it as its auth key and the app presents the same value.
      - key: OPENFGA_AUTHN_PRESHARED_KEYS
        generateValue: true

databases:
  - name: openfga-rbac-db
    plan: free
    databaseName: openfga
    user: openfga

services:
  # 1) OpenFGA server (prebuilt Docker image), migrated against free Postgres
  - name: openfga-server
    type: web
    runtime: image
    plan: free
    region: oregon
    image:
      url: ghcr.io/openfga/openfga:latest
    dockerCommand: run
    preDeployCommand: migrate
    healthCheckPath: /healthz
    envVarGroups: [openfga-shared-key]
    envVars:
      - key: OPENFGA_DATASTORE_ENGINE
        value: postgres
      - key: OPENFGA_DATASTORE_URI
        fromDatabase: { name: openfga-rbac-db, property: connectionString }
      - key: OPENFGA_PLAYGROUND_ENABLED
        value: "false"
      - key: OPENFGA_AUTHN_METHOD
        value: preshared

  # 2) The demo app (backend + frontend), calls OpenFGA over the private network
  - name: openfga-rbac-app
    type: web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVarGroups: [openfga-shared-key]
    envVars:
      - key: PORT
        value: "4000"
      - key: OPENFGA_API_URL
        fromService: { name: openfga-server, type: web, property: hostport }
      - key: OPENFGA_STORE_NAME
        value: openfga-rbac-demo
      - key: APP_DATABASE_URL
        fromDatabase: { name: openfga-rbac-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
